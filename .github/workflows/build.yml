name: Build PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build EBOOT.PBP (pspdev)
        run: docker run --rm -v "$PWD":/src -w /src pspdev/pspdev make

      - name: Pack for PSP
        run: |
          mkdir -p dist/BlockBlast
          cp EBOOT.PBP dist/BlockBlast/

      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlast-PSP
          path: dist
